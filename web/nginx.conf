map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# HTTPS 可能终止在宿主机反向代理。仅继承规范的首个 http/https 值；
# 没有可信上游头时回退到当前连接协议，避免把外部 https 误改为内部 http。
map $http_x_forwarded_proto $effective_forwarded_proto {
    default $scheme;
    ~*^[[:space:]]*https([[:space:]]*,|[[:space:]]*$) https;
    ~*^[[:space:]]*http([[:space:]]*,|[[:space:]]*$)  http;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /health {
        proxy_pass http://core:8080/health;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $effective_forwarded_proto;
    }

    location = /api {
        proxy_pass http://core:8080/api;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $effective_forwarded_proto;
    }

    location /api/ {
        proxy_pass http://core:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $effective_forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # 智能对话为 SSE 流式:关闭缓冲,保证 token 逐字下发而非整批到达
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
