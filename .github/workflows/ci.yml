name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: KubePilot Core 检查
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 配置 Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: 运行测试
        run: go test ./... -count=1 -timeout 60s

      - name: 运行静态检查
        run: go vet ./...

      - name: 检查依赖文件
        run: go mod tidy -diff

  console:
    name: KubePilot Console 检查
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 配置 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 运行测试
        run: npm test -- --reporter=dot

      - name: 检查国际化资源
        run: npm run check:i18n

      - name: 运行代码检查
        run: npm run lint

      - name: 构建 KubePilot Console
        run: npm run build

  compose:
    name: Compose 一键启动
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 配置 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          package-manager-cache: false

      - name: 检查 Compose 安全默认值
        run: |
          docker compose config --quiet
          node scripts/check-compose-security.mjs

      - name: 构建并启动全部服务
        run: docker compose up --build -d --wait --wait-timeout 180

      - name: 验证镜像密钥持久化
        run: node scripts/check-docker-secret.mjs kubepilot-core:local

      - name: 验证页面、健康接口与默认登录
        run: |
          curl --fail --silent --show-error http://127.0.0.1:5174/ > /tmp/kubepilot-index.html
          grep -q "KubePilot" /tmp/kubepilot-index.html
          curl --fail --silent --show-error http://127.0.0.1:5174/health > /tmp/kubepilot-health.json
          node -e "const r=require('/tmp/kubepilot-health.json'); if(r.status!=='ok'||r.service!=='kubepilot-core') process.exit(1)"
          curl --fail --silent --show-error \
            -H "Content-Type: application/json" \
            -d '{"username":"admin","password":"k8s@ops123"}' \
            http://127.0.0.1:5174/api/auth/login > /tmp/kubepilot-login.json
          node -e "const r=require('/tmp/kubepilot-login.json'); if(r.user?.username!=='admin'||r.password_change_required!==true) process.exit(1)"

      - name: 输出失败日志
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color --tail=200

      - name: 清理 Compose 资源
        if: always()
        run: docker compose down --volumes --remove-orphans
